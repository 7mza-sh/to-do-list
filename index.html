  <body>
    <div id="container">
      
      <div id="box">
        <h1>Welcome To My To-Do List</h1>
        <p>Please Enter Your Task</p>
        <input id="task-title-input" type="text" placeholder="Add Your Task Title" maxlength="30" required>
        <input id="task-content-input" type="text" placeholder="Add Your Task Content" maxlength="300" required>
        <button id="task-submit-button">Submit</button>
      </div>
      
      <div id="tasks">
        <h2>Tasks</h2>
        
        <div id="search-buttons-box">
          <button id="get-all-tasks" class="search-btn">All Tasks</button>
          <button id="get-done-tasks" class="search-btn">Done Tasks</button>
          <button id="get-undone-tasks" class="search-btn">Un-Done Tasks</button>
          <p class="tasks-counter">tasks: <span id="tasks-counter">0</span></p>
        </div>
        
        <div id="tasks-box"></div>
        
      </div>
    </div>
    
    <script src="script.js"></script>
  </body>

</html>
